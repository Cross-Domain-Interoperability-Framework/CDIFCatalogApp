name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5  # the schema enables PostGIS, which plain postgres lacks
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog-ci
          POSTGRES_DB: catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog -d catalog"
          --health-interval 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://catalog:catalog-ci@localhost:5432/catalog
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive  # server/converters, and the validation repository inside it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: deploy/Dockerfile fetches the converters commit the submodule is pinned to
        working-directory: .
        run: grep "CONVERTERS_COMMIT=$(git rev-parse HEAD:server/converters)" deploy/Dockerfile
      - run: pytest
