name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog-ci
          POSTGRES_DB: catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog -d catalog"
          --health-interval 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://catalog:catalog-ci@localhost:5432/catalog
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true  # server/converters; its own nested submodule is not needed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest
