# Development only: one command starts the database, the server and the web app.
#   docker compose up --build      then open http://localhost:5173
# The database password below is a local development value, not a secret.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog-dev
      POSTGRES_DB: catalog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 3s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://catalog:catalog-dev@db:5432/catalog
      # The address written into the catalog feed and record pages, and the one ORCID sends
      # people back to after sign-in. 127.0.0.1, not localhost: ORCID refuses a return address
      # containing "localhost". Set PUBLIC_URL in .env to change it.
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:5173}
    # Optional settings such as ORCID_API_BASE; see docs/setup-sandboxes.md.
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./server/app:/srv/app
      - ./server/tests:/srv/tests
      - ./server/converters:/srv/converters

  # Runs harvest jobs: scheduled ones, and those started through /api/harvest.
  worker:
    build: ./server
    command: ["python", "-m", "app.harvest.worker"]
    environment:
      DATABASE_URL: postgresql://catalog:catalog-dev@db:5432/catalog
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/app:/srv/app
      - ./server/converters:/srv/converters

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
      WATCH_POLL: "1"
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public

volumes:
  dbdata:
